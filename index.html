<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cache-Cache Géolocalisé v5.0 Premium</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Feuille de style principale -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Écran 1 : Salon / Accueil -->
  <div id="lobby-screen" class="screen active">
    <h1>Cache-Cache 5.0</h1>
    <div class="form-group">
      <label>Votre Pseudo</label>
      <input type="text" id="player-name-input" placeholder="Entrez votre nom">
    </div>

    <label>Couleur de Marqueur</label>
    <div class="color-picker">
      <div class="color-btn selected" style="background: #ff4757;" data-color="#ff4757"></div>
      <div class="color-btn" style="background: #2ed573;" data-color="#2ed573"></div>
      <div class="color-btn" style="background: #1e90ff;" data-color="#1e90ff"></div>
      <div class="color-btn" style="background: #ffa500;" data-color="#ffa500"></div>
    </div>

    <div class="form-group">
      <label>Choisir un Rôle</label>
      <div class="role-selector">
        <div class="role-btn selected" id="btn-role-hider" data-role="hider">Caché (Souris)</div>
        <div class="role-btn" id="btn-role-seeker" data-role="seeker">Chercheur (Chat)</div>
      </div>
    </div>

    <div class="form-group">
      <label>Temps de Cachette (minutes)</label>
      <input type="number" id="hide-time-input" value="5" min="1" max="15">
    </div>

    <button id="btn-create-room" class="btn" style="margin-bottom: 10px;">Créer un Salon</button>
    
    <hr style="border-color: #333; margin: 10px 0;">

    <div class="form-group">
      <input type="text" id="room-code-input" placeholder="Code à 4 chiffres">
      <button id="btn-join-room" class="btn btn-secondary" style="margin-top: 5px;">Rejoindre Salon</button>
    </div>
  </div>

  <!-- Écran 2 : Salle d'Attente -->
  <div id="waiting-room-screen" class="screen">
    <h2>Salle d'Attente</h2>
    <p style="text-align: center; margin-bottom: 20px;">Code du Salon : <strong id="waiting-room-code" style="color: var(--primary); font-size: 1.5rem;">----</strong></p>
    
    <div id="players-status-list" style="flex: 1; background: #2c2c2c; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
      <!-- Liste dynamique des joueurs -->
    </div>

    <button id="btn-ready" class="btn btn-success">Je suis Prêt !</button>
  </div>

  <!-- Écran 3 : Carte et Jeu Principal -->
  <div id="app-container" class="screen">
    <div id="map-header">
      <div>
        <div id="timer-display">00:00</div>
        <div id="status-text">Initialisation...</div>
      </div>
      <button id="btn-recenter" class="btn btn-secondary" style="padding: 5px 10px; font-size: 0.8rem;">🎯 GPS</button>
    </div>

    <div id="map"></div>

    <div id="map-controls">
      <!-- Zone des Défis -->
      <div id="tab-challenges">
        <!-- Formulaire Chercheur -->
        <div id="seeker-challenge-form" style="display: none;">
          <input type="text" id="custom-challenge-text" placeholder="Ex: Prends un banc en photo" style="width: 100%; margin-bottom: 5px;">
          <input type="number" id="custom-challenge-pts" placeholder="Points (ex: 50)" style="width: 100%; margin-bottom: 5px;">
          <button id="btn-send-challenge" class="btn btn-secondary" style="width: 100%;">Envoyer le Défi</button>
        </div>
        <!-- Formulaire Caché -->
        <div id="hider-challenge-form" style="display: none; text-align: center;">
          <p id="hider-challenge-desc" style="margin-bottom: 10px;">Aucun défi en cours.</p>
          <input type="file" id="challenge-photo-input" accept="image/*" capture="environment" style="display: none;">
          <button id="btn-trigger-photo" class="btn btn-success">📷 Prendre la photo</button>
        </div>
      </div>

      <button id="btn-found-seeker" class="btn" style="display: none;">J'ai trouvé le caché !</button>
      <button id="btn-confirm-hider" class="btn btn-success" style="display: none;">Confirmer l'attrapé</button>
    </div>
  </div>

  <!-- Écran 4 : Révision des Défis -->
  <div id="review-screen" class="screen">
    <h2>Révision des Défis</h2>
    <div id="photos-review-list" style="flex: 1; overflow-y: auto;">
      <!-- Photos dynamiques -->
    </div>
    <button id="btn-finish-review" class="btn">Voir le Podium</button>
  </div>

  <!-- Écran 5 : Podium Final -->
  <div id="podium-screen" class="screen" style="text-align: center;">
    <h2>🏆 Fin de Partie</h2>
    <div id="podium-display" style="margin: 30px 0; font-size: 1.2rem; flex: 1;">
      <!-- Rendu dynamique du vainqueur -->
    </div>
    <button id="btn-swap-roles" class="btn" style="margin-bottom: 10px;">Inverser les rôles</button>
    <button id="btn-leave-room" class="btn btn-secondary">Quitter le salon</button>
  </div>

  <!-- Bibliothèques Externes -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Vos Scripts JS -->
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
