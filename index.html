<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cache-Cache GPS V81</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <!-- ÉCRAN 1 : LOBBY PRINCIPAL -->
  <div id="lobby-screen" class="screen active">
    <div class="card">
      <div class="brand-header">
        <h1>Cache-Cache GPS</h1>
        <span class="version-badge">V81</span>
      </div>

      <div class="form-group">
        <label>Pseudo</label>
        <input type="text" id="player-name-input" placeholder="Ton pseudo" value="Joueur">
      </div>

      <div class="form-group">
        <label>Choisis ton rôle</label>
        <div class="role-selector">
          <button type="button" id="btn-role-hider" class="btn-role">🐭 Souris</button>
          <button type="button" id="btn-role-seeker" class="btn-role">🐱 Chat</button>
        </div>
      </div>

      <div class="form-group">
        <label>Couleur de ton repère</label>
        <div class="color-picker">
          <button type="button" class="color-btn selected" data-color="#38bdf8" style="background: #38bdf8;"></button>
          <button type="button" class="color-btn" data-color="#f43f5e" style="background: #f43f5e;"></button>
          <button type="button" class="color-btn" data-color="#10b981" style="background: #10b981;"></button>
          <button type="button" class="color-btn" data-color="#a855f7" style="background: #a855f7;"></button>
          <button type="button" class="color-btn" data-color="#f59e0b" style="background: #f59e0b;"></button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="form-group">
        <label>Temps de cachette (min)</label>
        <input type="number" id="hide-time-input" value="5" min="1" max="15">
      </div>

      <button type="button" id="btn-create-room" class="btn btn-primary">Créer un salon</button>

      <div class="join-box">
        <!-- Clavier numérique forcé sur mobile avec inputmode="numeric" -->
        <input type="number" inputmode="numeric" pattern="[0-9]*" id="room-code-input" placeholder="Code du salon (4 chiffres)">
        <button type="button" id="btn-join-room" class="btn btn-secondary">Rejoindre</button>
      </div>
    </div>
  </div>

  <!-- ÉCRAN 2 : SALLE D'ATTENTE -->
  <div id="waiting-room-screen" class="screen">
    <div class="card center-content">
      <h2>Salon : <span id="waiting-room-code" class="highlight-code">----</span></h2>
      <p class="subtitle">Partage ce code pour jouer ensemble</p>
      
      <div id="players-status-list" class="players-list">
        <!-- Liste dynamique des joueurs -->
      </div>

      <button type="button" id="btn-ready" class="btn btn-success">Je suis prêt !</button>
    </div>
  </div>

  <!-- ÉCRAN 3 : INTERFACE DE JEU PRINCIPALE -->
  <div id="app-container" class="screen">
    <!-- Navigation par onglets -->
    <nav class="top-nav">
      <button class="nav-tab active" data-tab="tab-map">🗺️ Carte</button>
      <button class="nav-tab" data-tab="tab-challenges">📋 Défis</button>
    </nav>

    <!-- Onglet CARTE -->
    <div id="tab-map" class="tab-page active">
      <div id="map"></div>

      <div class="overlay-card top-banner">
        <div id="timer-display" class="timer">00:00</div>
        <div id="status-text" class="status">Initialisation GPS...</div>
      </div>

      <div class="map-controls">
        <button id="btn-recenter" class="btn-icon">🎯</button>
        <button id="btn-found-seeker" class="btn btn-danger" style="display:none;">🚨 J'ai vu la Souris !</button>
        <button id="btn-confirm-hider" class="btn btn-warning" style="display:none;">✅ Confirmer l'attrape</button>
      </div>
    </div>

    <!-- Onglet DÉFIS -->
    <div id="tab-challenges" class="tab-page">
      <div class="challenges-container">
        <!-- Création de défi réservée au Chat -->
        <div id="seeker-challenge-creation" class="card challenge-form-card" style="display:none;">
          <h3>Proposer un défi</h3>
          <input type="text" id="custom-challenge-text" placeholder="Ex: Prends en photo une fleur bleue">
          <div class="inline-input">
            <input type="number" id="custom-challenge-pts" value="20" placeholder="Pts">
            <button id="btn-send-challenge" class="btn btn-primary">Envoyer</button>
          </div>
        </div>

        <div id="challenges-list"></div>
      </div>
    </div>

    <input type="file" id="challenge-photo-input" accept="image/*" capture="environment" style="display:none;">
  </div>

  <!-- ÉCRAN 4 : REVUE DES PHOTOS -->
  <div id="review-screen" class="screen">
    <div class="card">
      <h2>Validation des Défis</h2>
      <div id="photos-review-list"></div>
      <button id="btn-finish-review" class="btn btn-primary">Voir le Podium</button>
    </div>
  </div>

  <!-- ÉCRAN 5 : PODIUM -->
  <div id="podium-screen" class="screen">
    <div class="card center-content">
      <h2>🏆 Fin de Partie</h2>
      <div id="podium-display" class="podium-list"></div>
      <button id="btn-swap-roles" class="btn btn-primary">Rejouer</button>
      <button id="btn-leave-room" class="btn btn-secondary">Quitter</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
