<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cache-Cache GPS</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase Scripts (Compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

  <!-- ÉCRAN 1 : LOBBY -->
  <div id="lobby-screen" class="full-screen">
    <h2>🐭 Cache-Cache GPS 🐱</h2>
    
    <div class="card">
      <label>Votre Prénom :</label>
      <input type="text" id="player-name-input" placeholder="Ex: Lucas" value="Joueur">
    </div>

    <div class="card">
      <label>Choisissez votre rôle :</label>
      <div class="role-selector">
        <button type="button" id="btn-role-hider" class="role-btn">🐭 Souris</button>
        <button type="button" id="btn-role-seeker" class="role-btn">🐱 Chat</button>
      </div>
    </div>

    <div class="card">
      <label>Couleur du joueur :</label>
      <div class="color-picker">
        <button class="color-btn selected" data-color="#38bdf8" style="background:#38bdf8;"></button>
        <button class="color-btn" data-color="#f43f5e" style="background:#f43f5e;"></button>
        <button class="color-btn" data-color="#10b981" style="background:#10b981;"></button>
        <button class="color-btn" data-color="#a855f7" style="background:#a855f7;"></button>
      </div>
    </div>

    <div class="card">
      <label>Temps de cachette (minutes) :</label>
      <input type="number" id="hide-time-input" value="5" min="1" max="15">
    </div>

    <div class="actions">
      <button id="btn-create-room" class="btn-primary">Créer une partie</button>
      <hr>
      <input type="text" id="room-code-input" placeholder="Code à 4 chiffres">
      <button id="btn-join-room" class="btn-secondary">Rejoindre une partie</button>
    </div>
  </div>

  <!-- ÉCRAN 2 : SALLE D'ATTENTE -->
  <div id="waiting-room-screen" class="full-screen" style="display: none;">
    <h2>Salon : <span id="waiting-room-code">----</span></h2>
    <p>En attente des 2 joueurs...</p>
    <div id="players-status-list"></div>
    <button id="btn-ready" class="btn-success" style="margin-top:20px;">JE SUIS PRÊT !</button>
  </div>

  <!-- ÉCRAN 3 : JEU EN COURS -->
  <div id="app-container" class="full-screen" style="display: none;">
    <header class="top-bar">
      <div id="timer-display" class="timer">05:00</div>
      <div id="status-text" class="status">Préparation...</div>
    </header>

    <main class="content-area">
      <!-- PAGE TAB 1 : CARTE -->
      <div id="tab-map" class="tab-page active">
        <div id="map"></div>
        <button id="btn-recenter" class="fab-recenter">🎯</button>
      </div>

      <!-- PAGE TAB 2 : DÉFIS -->
      <div id="tab-challenges" class="tab-page">
        <div class="challenges-container">
          <div id="seeker-challenge-creation" class="card" style="display:none;">
            <h3>➕ Ajouter un défi (Chat)</h3>
            <input type="text" id="custom-challenge-text" placeholder="Ex: Photo d'un banc rouge">
            <input type="number" id="custom-challenge-pts" value="20" placeholder="Points">
            <button id="btn-send-challenge" class="btn-primary">Envoyer le défi</button>
          </div>
        </div>
        <input type="file" id="challenge-photo-input" accept="image/*" capture="environment" style="display:none;">
      </div>
    </main>

    <!-- ACTION FIN DE PARTIE -->
    <div class="bottom-actions">
      <button id="btn-found-seeker" class="btn-danger" style="display:none;">🚨 J'AI ATTRAPÉ LA SOURIS !</button>
      <button id="btn-confirm-hider" class="btn-danger" style="display:none;">✅ CONFIRMER QUE JE SUIS ATTRAPÉ</button>
    </div>

    <!-- NAVIGATION BAS DE PAGE -->
    <nav class="bottom-nav">
      <button class="nav-tab active" data-tab="tab-map">🗺️ Carte</button>
      <button class="nav-tab" data-tab="tab-challenges">📋 Défis</button>
    </nav>
  </div>

  <!-- ÉCRAN 4 : VALIDATION DES PHOTOS -->
  <div id="review-screen" class="full-screen" style="display: none;">
    <h2>📷 Validation des défis</h2>
    <div id="photos-review-list"></div>
    <button id="btn-finish-review" class="btn-primary" style="margin-top:20px;">Afficher le Podium</button>
  </div>

  <!-- ÉCRAN 5 : PODIUM -->
  <div id="podium-screen" class="full-screen" style="display: none;">
    <h2>🏆 Fin de Partie</h2>
    <div id="podium-display"></div>
    <button id="btn-swap-roles" class="btn-primary" style="margin-top:20px;">Rejouer / Inverser les rôles</button>
    <button id="btn-leave-room" class="btn-secondary" style="margin-top:10px;">Quitter</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- App JS (Version 6.0) -->
  <script src="app.js"></script>
</body>
</html>
