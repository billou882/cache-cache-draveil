<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cache-Cache GPS V81</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <!-- ÉCRAN 1 : LOBBY PRINCIPAL -->
  <div id="lobby-screen" class="app-screen active">
    <div class="card">
      <div class="header-banner">
        <h1>Cache-Cache GPS <span class="v81-tag">V81</span></h1>
      </div>

      <div class="form-group">
        <label for="player-name-input">Ton Pseudo</label>
        <input type="text" id="player-name-input" placeholder="Entre ton pseudo" value="Joueur">
      </div>

      <div class="form-group">
        <label>Ton Rôle</label>
        <div class="role-grid">
          <button type="button" id="btn-role-hider" class="btn-option">🐭 Souris</button>
          <button type="button" id="btn-role-seeker" class="btn-option">🐱 Chat</button>
        </div>
      </div>

      <div class="form-group">
        <label>Couleur du cercle et du repère</label>
        <div class="color-grid">
          <button type="button" class="color-btn selected" data-color="#38bdf8" style="background:#38bdf8;"></button>
          <button type="button" class="color-btn" data-color="#ef4444" style="background:#ef4444;"></button>
          <button type="button" class="color-btn" data-color="#10b981" style="background:#10b981;"></button>
          <button type="button" class="color-btn" data-color="#a855f7" style="background:#a855f7;"></button>
          <button type="button" class="color-btn" data-color="#f59e0b" style="background:#f59e0b;"></button>
        </div>
      </div>

      <hr class="separator">

      <div class="form-group">
        <label for="hide-time-input">Temps de cachette (minutes)</label>
        <input type="number" id="hide-time-input" value="5" min="1" max="15">
      </div>

      <button type="button" id="btn-create-room" class="btn btn-main">Créer une partie</button>

      <div class="join-section">
        <!-- Clavier 100% chiffres sur mobile -->
        <input type="number" inputmode="numeric" pattern="[0-9]*" id="room-code-input" placeholder="Code à 4 chiffres">
        <button type="button" id="btn-join-room" class="btn btn-sub">Rejoindre</button>
      </div>
    </div>
  </div>

  <!-- ÉCRAN 2 : SALLE D'ATTENTE -->
  <div id="waiting-room-screen" class="app-screen">
    <div class="card text-center">
      <h2>Salon : <span id="waiting-room-code" class="code-display">----</span></h2>
      <p class="subtext">Donne ce code à l'autre joueur</p>
      
      <div id="players-status-list" class="status-box"></div>

      <button type="button" id="btn-ready" class="btn btn-action">Prêt !</button>
    </div>
  </div>

  <!-- ÉCRAN 3 : JEU (MAP & DÉFIS) -->
  <div id="app-container" class="app-screen">
    <div class="nav-bar">
      <button class="tab-btn active" data-tab="tab-map">Carte</button>
      <button class="tab-btn" data-tab="tab-challenges">Défis</button>
    </div>

    <!-- Page Carte -->
    <div id="tab-map" class="tab-content active">
      <div id="map"></div>

      <div class="floating-hud">
        <div id="timer-display" class="hud-timer">00:00</div>
        <div id="status-text" class="hud-status">Recherche du signal GPS...</div>
      </div>

      <div class="floating-actions">
        <button id="btn-recenter" class="icon-btn">🎯</button>
        <button id="btn-found-seeker" class="btn btn-danger" style="display:none;">🚨 J'ai trouvé la Souris</button>
        <button id="btn-confirm-hider" class="btn btn-warning" style="display:none;">✅ Confirmer la capture</button>
      </div>
    </div>

    <!-- Page Défis -->
    <div id="tab-challenges" class="tab-content">
      <div class="challenges-wrapper">
        <div id="seeker-challenge-creation" class="card" style="display:none;">
          <h3>Créer un défi</h3>
          <input type="text" id="custom-challenge-text" placeholder="Description du défi">
          <div class="input-row">
            <input type="number" id="custom-challenge-pts" value="20">
            <button id="btn-send-challenge" class="btn btn-main">Envoyer</button>
          </div>
        </div>

        <div id="challenges-list"></div>
      </div>
    </div>

    <input type="file" id="challenge-photo-input" accept="image/*" capture="environment" style="display:none;">
  </div>

  <!-- ÉCRAN 4 : REVUE -->
  <div id="review-screen" class="app-screen">
    <div class="card">
      <h2>Vérification des photos</h2>
      <div id="photos-review-list"></div>
      <button id="btn-finish-review" class="btn btn-main">Résultats</button>
    </div>
  </div>

  <!-- ÉCRAN 5 : PODIUM -->
  <div id="podium-screen" class="app-screen">
    <div class="card text-center">
      <h2>🏆 Classement</h2>
      <div id="podium-display" class="podium-box"></div>
      <button id="btn-swap-roles" class="btn btn-main">Rejouer</button>
      <button id="btn-leave-room" class="btn btn-sub">Quitter</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
