<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cache-Cache GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ÉCRAN ACCUEIL / LOBBY -->
  <div id="lobby-screen" class="screen">
    <div class="card">
      <h2>🥷 Cache-Cache GPS V5.1</h2>
      <div class="form-group">
        <label>nom du groupe :</label>
        <input type="text" id="player-name-input" placeholder="Ex: Lucas">
      </div>
      
      <div class="form-group">
        <label>Couleur de ton groupe:</label>
        <div class="color-picker">
          <button class="color-btn selected" data-color="#38bdf8" style="background:#38bdf8;"></button>
          <button class="color-btn" data-color="#a855f7" style="background:#a855f7;"></button>
          <button class="color-btn" data-color="#f59e0b" style="background:#f59e0b;"></button>
          <button class="color-btn" data-color="#10b981" style="background:#10b981;"></button>
          <button class="color-btn" data-color="#ec4899" style="background:#ec4899;"></button>
        </div>
      </div>

      <div class="form-group">
        <label>Rôle pour cette manche :</label>
        <div class="role-selector">
          <button id="btn-role-hider" class="btn-role">🥷 Caché</button>
          <button id="btn-role-seeker" class="btn-role">🕵️ Chercheur</button>
        </div>
      </div>

      <hr>

      <div class="form-group">
        <label>Temps de cachette (min) :</label>
        <input type="number" id="hide-time-input" value="5" min="1">
      </div>

      <button id="btn-create-room" class="btn-primary">Créer une partie</button>
      
      <div class="or-divider">OU</div>

      <div class="form-group">
        <input type="text" id="room-code-input" placeholder="Code du salon (ex: 1234)">
      </div>
      <button id="btn-join-room" class="btn-secondary">Rejoindre une partie</button>
    </div>
  </div>

  <!-- SALLE D'ATTENTE -->
  <div id="waiting-room-screen" class="screen" style="display: none;">
    <div class="card text-center">
      <h2>Salon : <span id="waiting-room-code">----</span></h2>
      <p style="color:#64748b; margin-bottom: 14px;">En attente des joueurs...</p>
      <div id="players-status-list" class="status-list"></div>
      <button id="btn-ready" class="btn-primary" style="margin-top: 15px;">Je suis prêt !</button>
    </div>
  </div>

  <!-- APPLICATION PRINCIPALE -->
  <div id="app-container" style="display: none;">
    
    <header class="app-header">
      <div class="timer-box">
        <span class="timer-label">⏱️ TEMPS</span>
        <span id="timer-display" class="timer-value">05:00</span>
      </div>
      <div id="status-text" class="status-banner">Préparez-vous !</div>
    </header>

    <div class="tab-content">
      
      <!-- PAGE CARTE -->
      <div id="tab-map" class="tab-page active">
        <div id="map"></div>
        <button id="btn-recenter" class="map-btn">🎯 Se recentrer</button>
        
        <div id="map-notification" class="map-toast" style="display: none;">
          🎯 Nouveau défi disponible ! Voir onglet Défis.
        </div>

        <button id="btn-found-seeker" class="btn-danger action-map-btn" style="display: none;">
          🚨 J'ai trouvé le caché !
        </button>
        <button id="btn-confirm-hider" class="btn-success action-map-btn" style="display: none;">
          ✅ Confirmer le marquage
        </button>
      </div>

      <!-- PAGE DÉFIS -->
      <div id="tab-challenges" class="tab-page">
        <div class="challenges-container">
          <div id="seeker-challenge-creation" class="challenge-card" style="display: none;">
            <h3>🎯 Créer un défi pour le caché</h3>
            <input type="text" id="custom-challenge-text" placeholder="Ex: Prends une photo d'un banc rouge...">
            <div style="display: flex; gap: 8px; margin-top: 8px;">
              <input type="number" id="custom-challenge-pts" value="20" placeholder="Pts" style="width: 80px;">
              <button id="btn-send-challenge" class="btn-primary" style="flex: 1;">Lancer le défi (10 min)</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <input type="file" id="challenge-photo-input" accept="image/*" capture="camera" style="display: none;">

    <nav class="bottom-nav">
      <button class="nav-tab active" data-tab="tab-map">🗺️ Carte</button>
      <button class="nav-tab" data-tab="tab-challenges">
        🎯 Défis <span id="challenge-badge" class="badge" style="display: none;">!</span>
      </button>
    </nav>
  </div>

  <!-- ÉCRAN VALIDATION -->
  <div id="review-screen" class="screen" style="display: none;">
    <div class="card">
      <h2>📷 Validation des défis</h2>
      <div id="photos-review-list"></div>
      <button id="btn-finish-review" class="btn-primary" style="margin-top: 15px;">Voir le podium 🏆</button>
    </div>
  </div>

  <!-- ÉCRAN PODIUM -->
  <div id="podium-screen" class="screen" style="display: none;">
    <div class="card text-center">
      <h2>🏆 Fin de la manche</h2>
      <div id="podium-display" class="podium-container"></div>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button id="btn-swap-roles" class="btn-primary" style="flex: 1;">Manche suivante 🔄</button>
        <button id="btn-leave-room" class="btn-secondary" style="flex: 1;">Quitter 🚪</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>
</body>
</html>
