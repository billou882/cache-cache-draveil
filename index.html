<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cache-Cache Draveil - Pro Edition</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Mon style CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Carte Leaflet -->
  <div id="map"></div>

  <!-- Layer Interface Utilisateur (HUD) -->
  <div class="ui-layer">
    <header class="interactive">
      <div class="app-title">Cache-Cache Draveil</div>
      <div id="role-badge" class="badge badge-none">Attente</div>
    </header>

    <div class="bottom-panel interactive">
      <div class="card timer-container">
        <div class="timer-label">Chrono de Survie</div>
        <div id="timer" class="timer-val">00:00</div>
      </div>

      <div class="controls-grid">
        <button id="btn-souris" class="btn btn-souris">🐭 Souris</button>
        <button id="btn-chat" class="btn btn-chat">🐱 Chat</button>
        <button id="btn-hotel" class="btn btn-secondary btn-full" disabled>🏢 En bâtiment (Pause GPS)</button>
        <button id="btn-zone" class="btn btn-action btn-full" disabled>⚡ Déplacer la Zone (Glissement)</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- App JS module -->
  <script type="module" src="app.js"></script>
</body>
</html>
